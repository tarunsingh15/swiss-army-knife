[project]
name = "pdf-tool"
version = "0.1.0"
description = "Standalone PDF extraction tool with citation-anchored blocks (PyMuPDF backend)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pymupdf==1.28.2",
  "puremagic",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
pdf-tool = "pdf_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_tool"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
