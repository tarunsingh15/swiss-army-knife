[project]
name = "document-parser"
version = "0.1.0"
description = "Standalone scanned-PDF OCR tool with citation-anchored blocks (PaddleOCR backend)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pymupdf==1.28.2",
  "typer",
]

[project.optional-dependencies]
ocr = [
  "paddleocr",
  "paddlepaddle",
]
dev = [
  "pillow",
  "pytest",
  "ruff",
]

[project.scripts]
doc-parser = "document_parser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["document_parser"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ocr: tests requiring PaddleOCR and paddlepaddle",
]
